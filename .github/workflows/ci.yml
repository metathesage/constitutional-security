name: Constitutional Security CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Rust enforcer build + test
  enforcer:
    name: Enforcer (Rust + Coq)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Install Coq
        run: |
          sudo apt-get update
          sudo apt-get install -y coq coqide
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            enforcer/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build enforcer
        run: cd enforcer/rust && cargo build --release
      
      - name: Run Rust tests
        run: cd enforcer/rust && cargo test --release
      
      - name: Run Clippy
        run: cd enforcer/rust && cargo clippy -- -D warnings
      
      - name: Check formatting
        run: cd enforcer/rust && cargo fmt --check
      
      - name: Coq proofs
        run: |
          cd enforcer/coq
          make
          make test
      
      - name: Upload enforcer binary
        uses: actions/upload-artifact@v4
        with:
          name: enforcer-binary
          path: enforcer/rust/target/release/enforcer
          retention-days: 30

  # Verification pipeline (Node.js)
  verification:
    name: Verification Pipeline
    runs-on: ubuntu-latest
    needs: enforcer
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: verification/package-lock.json
      
      - name: Install dependencies
        run: cd verification && npm ci
      
      - name: Run verification (all policies)
        run: |
          cd verification
          npm run verify:all
      
      - name: Upload verification logs
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: verification/logs/
          retention-days: 30

  # Benchmarks
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: enforcer
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: benchmarks/requirements.txt
      
      - name: Install dependencies
        run: |
          cd benchmarks
          pip install -r requirements.txt
      
      - name: Download model (cached)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-llama-70b-4bit
      
      - name: Run full benchmark (10K prompts)
        run: |
          cd benchmarks
          python -m benchmarks.run --suite full --model llama-3.1-70b-4bit --output results/full_benchmark.csv
      
      - name: Run ablation study
        run: |
          cd benchmarks
          python -m benchmarks.run --ablation --output results/ablation.csv
      
      - name: Generate report
        run: |
          cd benchmarks
          python -m benchmarks.report --input results/full_benchmark.csv --output results/report.md
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
          retention-days: 30
      
      - name: Check regression
        run: |
          cd benchmarks
          python -m benchmarks.check_regression --current results/full_benchmark.csv --baseline .github/baseline_benchmark.csv

  # Paper build
  paper:
    name: Build Paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pandoc + LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended
      
      - name: Build PDF
        run: |
          python scripts/build_pdf.py
      
      - name: Upload paper PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: papers/constitutional-security.pdf
          retention-days: 90

  # Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [enforcer, verification, benchmarks, paper]
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create release assets
        run: |
          mkdir -p release
          cp artifacts/enforcer-binary/enforcer release/
          cp artifacts/paper-pdf/constitutional-security.pdf release/
          cd release && sha256sum * > SHA256SUMS.txt
      
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/enforcer
            release/constitutional-security.pdf
            release/SHA256SUMS.txt
          draft: false
          prerelease: false

  # Documentation deploy
  docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Build docs
        run: |
          # Build documentation site (e.g., with Sphinx or MkDocs)
          pip install mkdocs mkdocs-material
          mkdocs build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site